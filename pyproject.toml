[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matf-master-vpn"
version = "0.1.0"
description = "Research VPN prototype for security and performance analysis"
requires-python = ">=3.8"
dependencies = [
	"cryptography>=41",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.4",
	"pytest-cov>=4.1",
]
gui = [
	"PyQt5>=5.15",
]

[tool.setuptools.packages.find]
where = ["src"]
